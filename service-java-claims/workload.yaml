apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: claims-service

endpoints:
  - name: claims-api
    port: 8080
    type: HTTP
    visibility:
      - external

configurations:
  env:
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:postgresql://claims-postgres:5432/claimsdb?currentSchema=dev"
    - name: SPRING_DATASOURCE_USERNAME
      value: "claims"
    - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
      value: "dev"
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: "update"
  files:
    - key: db-password
      mountPath: /secrets/db-password
      valueFrom:
        secretKeyRef:
          name: claims-db-secret-dev
          key: db-password

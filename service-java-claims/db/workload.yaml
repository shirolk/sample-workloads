apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: claims-postgres

endpoints:
  - name: postgres
    port: 5432
    type: TCP

configurations:
  env:
    - name: POSTGRES_USER
      value: "claims"
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: claims-db-secret-dev
          key: db-password
    - name: POSTGRES_DB
      value: "claimsdb"
